# nginx server block for the Locker API. Installed by hand on the VPS (see docs/operations.md);
# CI does not deploy it. TLS: Cloudflare proxies the domain and this origin uses a Cloudflare
# Origin Certificate, with the zone in Full (strict) mode.
server {
    listen 80;
    server_name api.locker.center;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.locker.center;
    ssl_certificate     /etc/ssl/rokev-dynamics/locker/cert.pem;
    ssl_certificate_key /etc/ssl/rokev-dynamics/locker/key.pem;

    location / {
        proxy_pass http://127.0.0.1:__API_PORT__; # replaced with API_PORT from the VPS .env on install
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
