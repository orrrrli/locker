# nginx server block for the Locker API. Installed by hand on the VPS (see docs/operations.md);
# CI does not deploy it. TLS: Cloudflare proxies the domain and this origin uses a Cloudflare
# Origin Certificate, with the zone in Full (strict) mode.
server {
    listen 80;
    server_name api.locker.center;
    access_log off; # only redirects; an invite link here would log its token
    return 301 https://api.locker.center$request_uri;
}

server {
    listen 443 ssl;
    server_name api.locker.center;
    ssl_certificate     /etc/ssl/rokev-dynamics/locker/cert.pem;
    ssl_certificate_key /etc/ssl/rokev-dynamics/locker/key.pem;

    # Behind Cloudflare, the peer is a Cloudflare edge. Take the visitor's IP from
    # CF-Connecting-IP, but only when the connection comes from Cloudflare: a client that
    # reaches the origin directly cannot pick its own IP. $remote_addr below is then the
    # visitor, which is what the API's per-IP login limit keys on (X-Real-IP).
    # Ranges from https://www.cloudflare.com/ips/ (checked 2026-10-08); they rarely change.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Every proxy_set_header lives here, at server level, and both locations inherit them.
    # Overwriting X-Real-IP drops any value the client sent. A location that sets its own
    # proxy_set_header inherits none of these and must repeat them all.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr; # not $proxy_add_x_forwarded_for: drop client-sent values
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:__API_PORT__; # replaced with API_PORT from the VPS .env on install
    }

    # Invite links carry their token in the path (/i/<token>): never write them to a log.
    # The access log is off; the error log logs the request line when the API is down
    # (every deploy recreates it), so it keeps only `crit`. /health still shows an outage.
    # The accept call sends the token in the body, so it needs nothing here.
    location /i/ {
        access_log off;
        error_log /var/log/nginx/error.log crit;
        proxy_pass http://127.0.0.1:__API_PORT__;
    }
}
