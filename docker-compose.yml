services:
  api:
    image: ghcr.io/orrrrli/locker-api:latest
    build: ./api # local: docker compose up --build
    env_file: .env
    ports:
      - "127.0.0.1:${API_PORT:?}:${API_PORT:?}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s # longer than the API's 10s shutdownTimeout
    deploy:
      resources:
        limits:
          memory: 256M

  postgres:
    image: postgres:17-alpine
    environment: # only what postgres needs, not the whole .env
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    # no ports: reachable only on the compose network

volumes:
  pgdata:
