services:
  api:
    image: ghcr.io/orrrrli/locker-api:${API_TAG:-latest} # CI deploys by commit SHA
    build: ./api # local: docker compose up --build
    env_file: .env
    environment:
      # Soft heap limit below the container's 256M, so the GC works harder
      # before the kernel OOM-kills the process.
      GOMEMLIMIT: 200MiB
    ports:
      - "127.0.0.1:${API_PORT:?}:${API_PORT:?}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s # longer than the API's 10s shutdownTimeout
    deploy:
      resources:
        limits:
          memory: 256M

  postgres:
    image: public.ecr.aws/docker/library/postgres:17-alpine
    environment: # only what postgres needs, not the whole .env
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1: check TCP, not the socket, which is up during first-boot init
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    # no ports: reachable only on the compose network

  backup:
    # Same tag as api: CI builds both images in one run. The variable keeps its old name.
    image: ghcr.io/orrrrli/locker-backup:${API_TAG:-latest}
    build: ./backup
    # R2 keys and the age PUBLIC key live in their own file, read only by this service,
    # so the api never receives them. backup.sh checks each one at start.
    env_file:
      - path: .env.backup
        required: false # local `docker compose up` works without it
    environment: # only the database values the backup needs, not the whole .env
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  pgdata:
