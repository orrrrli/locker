openapi: 3.1.0
info:
  title: Locker API
  version: 0.1.0
  description: |
    HTTP contract of the Locker Go API, written from the code in
    `api/internal/http` (router.go lists every route). Only registered routes
    are documented.

    Conventions every client can rely on:

    - JSON bodies are capped at 16 KiB. A larger body answers 413
      `body_too_large`; a body that is not valid JSON for the endpoint (wrong
      type, malformed, or with a field the endpoint does not know) answers
      400 `invalid_request`. Field names match case-insensitively (Go's
      encoding/json), so `"Position"` reads as `position`; always send the
      exact lowercase names. Only the first JSON value of the body is read.
    - Every error is JSON `{"error": "<code>"}` with a stable code (see the
      `Error` schema). Two codes carry extra fields: `already_member` and
      `last_admin_of_teams`.
    - An unknown path answers 404 `not_found` and a known path with the wrong
      method answers 405 `method_not_allowed` with an `Allow` header, both as
      JSON (see `components/responses/NotFound` and `MethodNotAllowed`).
      A GET route also answers HEAD.
    - Any unexpected failure answers 500 `internal`.
    - Timestamps are RFC 3339 strings, always UTC with whole seconds and no
      fraction, e.g. "2026-10-11T23:53:00Z", so Swift's `.iso8601` strategy
      decodes them.
    - Ids are positive 64-bit integers. A path id that is not a positive
      integer answers 404, the same as an unknown id.
    - Team routes hide a team from anyone who is not an active member of it
      (strangers, pending and left members): they get 404 `not_found`, not 403.
servers:
  - url: https://api.locker.center
tags:
  - name: auth
  - name: account
  - name: teams
  - name: invites
  - name: memberships
  - name: matches
  - name: notifications
  - name: venues
  - name: public
    description: Public team, venue and league pages (R17), for any signed-in user.
  - name: operator
    description: |
      Curation routes under `/operator`, only for the user whose
      `is_operator` flag is set by hand in the database (rule 12). Anyone
      else gets 403 `forbidden` on any `/operator` path, even an unknown one.
  - name: infra
    description: Health check, Universal Links and the invite landing page.

paths:
  /health:
    get:
      tags: [infra]
      operationId: health
      summary: Liveness check
      description: Reports that the process is up. It does not check the database.
      responses:
        "200":
          description: The process is up.
          content:
            text/plain:
              schema:
                type: string
                const: ok

  /.well-known/apple-app-site-association:
    get:
      tags: [infra]
      operationId: appleAppSiteAssociation
      summary: Universal Links association file
      description: |
        Tells iOS to open invite links (`/i/*`) in the app. Answers 404
        `not_found` while no Apple app ID is configured.
      responses:
        "200":
          description: The association file.
          content:
            application/json:
              schema:
                type: object
              example:
                applinks:
                  details:
                    - appIDs: ["<team id>.<bundle id>"]
                      components:
                        - "/": "/i/*"
                          comment: invite links
        "404":
          $ref: "#/components/responses/NotFound"

  /i/{token}:
    get:
      tags: [infra]
      operationId: inviteLanding
      summary: Invite link landing page (HTML)
      description: |
        What a browser shows for an invite link when the app is not installed.
        With the app installed, iOS opens the link in the app instead. The page
        never reads the token or the database. The app accepts the invite with
        `POST /invites/accept`, sending the token in the body.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Static HTML page (Spanish), sent with `Cache-Control no-store` and `Referrer-Policy no-referrer`.
          content:
            text/html:
              schema:
                type: string

  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create an account with email and password and sign in
      description: |
        Rate limited to 30 registrations per client IP per hour. Only requests
        that reach the password hash count (a new account or a taken email).
        The limit is checked before the body is read, so a 429 can come before
        a 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created; the session token is ready to use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          description: "`email_taken`: the email already has an account."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        const: email_taken
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "422":
          description: |
            Validation failed. Codes:
            - `invalid_name`: name empty or over 100 characters after trimming.
            - `invalid_email`: not a valid address, or over 254 bytes.
            - `password_too_short`: under 8 characters.
            - `password_too_long`: over 128 characters.
            - `birth_date_required`: birth_date missing or empty.
            - `invalid_birth_date`: not `YYYY-MM-DD` (a client bug).
            - `birth_date_in_future`: a date after today.
            - `underage`: younger than 15.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum:
                          - invalid_name
                          - invalid_email
                          - password_too_short
                          - password_too_long
                          - birth_date_required
                          - invalid_birth_date
                          - birth_date_in_future
                          - underage
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/ServerBusy"

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in with email and password
      description: |
        Throttled per (email, IP) pair, per account and per client IP, plus a
        budget of successful logins per account. A throttled request gets 429
        whether or not the email exists. An email that is not even a valid
        address answers 401 `invalid_credentials`, never 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          description: "`invalid_credentials`: unknown email or wrong password (same answer for both)."
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/WWWAuthenticate"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        const: invalid_credentials
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/ServerBusy"

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Delete the caller's session
      description: No request body. The token stops working at once.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Session deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"

  /me:
    delete:
      tags: [account]
      operationId: deleteMe
      summary: Delete the caller's account
      description: |
        Deletes the account behind the session (never from a path or body id).
        Memberships become left "Ex-jugador #<id>" rows so team history stays.
        Refused with 409 `last_admin_of_teams` while the caller is the only
        active admin (Capitán) of any team; the body lists those teams. In a
        team where the caller is the only active member (`sole_member`), there
        is no one to promote: the caller dissolves it with `DELETE /teams/{id}`
        first (R6.8).
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Account deleted; every session is gone.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: "`not_found`: the account was deleted by a concurrent request between authentication and deletion."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        const: not_found
        "409":
          description: "`last_admin_of_teams`: promote another admin in each listed team, or dissolve it when `sole_member` is true."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LastAdminOfTeamsError"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/TeamBusy"

  /me/matches:
    get:
      tags: [matches]
      operationId: listMyUpcomingMatches
      summary: List the caller's upcoming matches across their teams, soonest first
      description: |
        Matches with `starts_at` later than now from every team where the
        caller is an active member; pending and left memberships do not count
        (R14). A match at or after its kickoff has started and is left out.
        No team, or no upcoming match, is `[]` with 200. Counts take only
        answers of members active in the team now. Not paginated.
      security:
        - bearerAuth: []
      parameters:
        - name: upcoming
          in: query
          required: true
          description: Must be `true`; the only value defined.
          schema:
            type: string
            const: "true"
      responses:
        "200":
          description: The caller's upcoming matches.
          content:
            application/json:
              schema:
                type: object
                required: [matches]
                properties:
                  matches:
                    type: array
                    items:
                      $ref: "#/components/schemas/UpcomingMatch"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: "`invalid_upcoming`: the `upcoming` query parameter is missing or not `true`."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        const: invalid_upcoming
        "500":
          $ref: "#/components/responses/Internal"

  /me/notifications:
    get:
      tags: [notifications]
      operationId: listMyNotifications
      summary: List the caller's notices across their teams, newest first
      description: |
        One inbox with the notices of every team where the caller is an
        active member now (R24.6); pending and left memberships show nothing,
        and leaving a team drops its notices. Pages of 50, newest first: pass
        `next_before` from one page as `before` to get the next. Notices that
        arrive meanwhile never shift a page. No notice is `[]` with 200.
      security:
        - bearerAuth: []
      parameters:
        - name: before
          in: query
          required: false
          description: Return notices older than this notice id. Omit it for the first page.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: One page of the caller's inbox.
          content:
            application/json:
              schema:
                type: object
                required: [notifications, next_before]
                properties:
                  notifications:
                    type: array
                    maxItems: 50
                    items:
                      $ref: "#/components/schemas/InboxNotification"
                  next_before:
                    description: The `before` value for the next page; null on the last page.
                    type: [integer, "null"]
                    format: int64
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: "`invalid_before`: `before` is repeated or not a positive integer."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        const: invalid_before
        "500":
          $ref: "#/components/responses/Internal"

  /notifications/{id}/read:
    post:
      tags: [notifications]
      operationId: markNotificationRead
      summary: Mark a notice as opened by the caller
      description: |
        Called when the caller opens the notice in the inbox or taps its push
        (R11.8). Only the first open is kept, so repeating it answers 204
        again without moving `read_at`. The UI says "opened the notice" (R11.11).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "204":
          description: Marked as read (or already was).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            `not_found`: the notice is not in the caller's inbox: unknown, of
            another team, of a team they are no longer active in, sent before
            they joined, or an id that is not a positive integer.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        const: not_found
        "500":
          $ref: "#/components/responses/Internal"

  /me/device-tokens:
    post:
      tags: [notifications]
      operationId: registerDeviceToken
      summary: Register the APNs token of the caller's device
      description: |
        The app calls it on every launch with the APNs token (R11.7). The API
        keeps one row per device: a repeat refreshes `last_seen_at`, and a
        token stored for another user moves to the caller, so the previous
        user stops getting pushes on that device. The token is stored lowercase.

        The token is tied to the calling session. Logging out, or the session
        expiring after 60 idle days, removes it, so a signed-out device gets no
        pushes and the user's other devices keep theirs. Register again after
        every login. A session is one device: a new token from the same
        session (after a reinstall) replaces its old one. An account keeps
        its 10 most recently seen devices; the least recently seen is dropped
        when an 11th registers (parallel calls can leave a few more until the
        next one). At most 20 calls per user per hour.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              additionalProperties: false
              properties:
                token:
                  type: string
                  description: APNs device token as hex, either case. Do not assume 64 characters.
                  pattern: "^[0-9a-fA-F]+$"
                  minLength: 1
                  maxLength: 200
      responses:
        "204":
          description: Stored, refreshed or moved to the caller.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "422":
          description: "`invalid_device_token`: empty, not hex, or over 200 characters."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        const: invalid_device_token
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        "500":
          $ref: "#/components/responses/Internal"

  /me/device-tokens/{token}:
    delete:
      tags: [notifications]
      operationId: deleteDeviceToken
      summary: Stop pushes to one of the caller's devices
      description: |
        Removes the caller's own token without ending the session. Logging
        out removes it anyway. To keep push off on this device, the app must
        also stop calling POST /me/device-tokens at launch, which would put
        the token back. Only the caller's token goes: an unknown token, or
        one stored for another user, also answers 204 and removes nothing,
        so a retry is safe and the answer reveals nothing. The token is hex
        in either letter case, like the POST.
      security:
        - bearerAuth: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]+$"
            minLength: 1
            maxLength: 200
      responses:
        "204":
          description: Removed, or the caller had no such token.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: "`invalid_device_token`: not hex, or over 200 characters."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        const: invalid_device_token
        "500":
          $ref: "#/components/responses/Internal"

  /me/join-requests:
    get:
      tags: [memberships]
      operationId: listMyJoinRequests
      summary: List the caller's pending memberships
      description: |
        The caller's pending memberships, from a join request or an invite,
        newest first, for the pending section of "Mis equipos". A membership
        leaves this list once an admin approves or rejects it.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's pending memberships; an empty list when there are none.
          content:
            application/json:
              schema:
                type: object
                required: [join_requests]
                properties:
                  join_requests:
                    type: array
                    items:
                      $ref: "#/components/schemas/JoinRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"

  /teams:
    post:
      tags: [teams]
      operationId: createTeam
      summary: Create a team; the caller becomes its active admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamRequest"
      responses:
        "201":
          description: Team created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "422":
          description: |
            - `invalid_name`: empty or over 35 characters after trimming, or contains control or invisible characters.
            - `invalid_timezone`: not a canonical IANA zone such as `America/Tijuana`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [invalid_name, invalid_timezone]
        "500":
          $ref: "#/components/responses/Internal"
    get:
      tags: [teams]
      operationId: listTeams
      summary: List the teams where the caller is an active member
      description: Pending and left memberships do not count.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's teams.
          content:
            application/json:
              schema:
                type: object
                required: [teams]
                properties:
                  teams:
                    type: array
                    items:
                      $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"

  /teams/{id}:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    get:
      tags: [teams]
      operationId: getTeam
      summary: Get a team
      description: Active members only.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
    patch:
      tags: [teams]
      operationId: updateTeam
      summary: Rename a team or change its timezone
      description: |
        Admins only. Send `name`, `timezone` or both; an absent or null field
        keeps its value.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamRequest"
      responses:
        "200":
          description: The updated team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "422":
          description: |
            - `nothing_to_update`: neither name nor timezone sent.
            - `invalid_name`: empty or over 35 characters after trimming, or contains control or invisible characters.
            - `invalid_timezone`: not a canonical IANA zone.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [nothing_to_update, invalid_name, invalid_timezone]
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/TeamBusy"
    delete:
      tags: [teams]
      operationId: dissolveTeam
      summary: Dissolve a team
      description: |
        Admins only, and only when the caller is the team's only active member
        (R6.8). In one transaction it revokes every invite, rejects every
        pending member and sets the caller's membership left. Final: the team
        disappears from `GET /teams` and every team route answers 404. Its
        history (memberships, attendance, fees) is kept. The sole member of a
        team dissolves it before `DELETE /me` (R5.4).
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The team is dissolved.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`team_has_members`: the team has another active member; remove the players, and any other admin must leave on their own (R6.9, R6.12). Nothing changed."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        const: team_has_members
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/TeamBusy"

  /teams/{id}/invites:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    get:
      tags: [invites]
      operationId: listInvites
      summary: List the team's invites
      description: |
        Admins only. The team's invites that have not expired, newest first,
        revoked ones included so the admin sees a revoke worked. Never the
        token: use `id` to revoke a leaked link. No pagination: at most 20
        are live at a time; revoked ones stay listed until they expire
        (7 days).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The invites; an empty array when there are none.
          content:
            application/json:
              schema:
                type: object
                required: [invites]
                properties:
                  invites:
                    type: array
                    items:
                      $ref: "#/components/schemas/InviteSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      tags: [invites]
      operationId: createInvite
      summary: Create an invite link
      description: |
        Admins only. No request body. The link works for 7 days. The token
        and url are returned only here. Rate limited to 20 per user per hour;
        the limit is checked before the admin check, so a 429 can come before
        a 403 or 404.
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Invite created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`too_many_invites`: the team already has 20 live invites; revoke one or wait for one to expire."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        const: too_many_invites
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/TeamBusy"

  /teams/{id}/invites/{inviteId}:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - name: inviteId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    delete:
      tags: [invites]
      operationId: revokeInvite
      summary: Revoke an invite
      description: |
        Admins only. Idempotent: revoking an already revoked or expired invite
        of the team answers 204 again.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Invite revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: |
            - `not_found`: the team is unknown or hidden from the caller.
            - `invite_not_found`: the team has no such invite (including an invite of another team, or an inviteId that is not a positive integer).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [not_found, invite_not_found]
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/TeamBusy"

  /invites/accept:
    post:
      tags: [invites]
      operationId: acceptInvite
      summary: Accept an invite
      description: |
        Creates a pending player membership; an admin approves it later. A
        user who left the team gets their old row back as pending. Rate
        limited to 20 per user per 15 minutes.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteRequest"
      responses:
        "201":
          description: Membership is now pending approval.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteAccepted"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            - `invite_not_found`: the token is missing, malformed or unknown.
            - `not_found`: rare race; the caller's membership disappeared while the request ran.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [invite_not_found, not_found]
        "409":
          description: "`already_member`: the caller is already active or pending in the team; `status` says which."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlreadyMemberError"
        "410":
          description: |
            - `invite_expired`: the invite is past its 7 days.
            - `invite_revoked`: an admin revoked it. Revoked is checked before expired.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [invite_expired, invite_revoked]
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        "500":
          $ref: "#/components/responses/Internal"

  /teams/{id}/join-requests:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    post:
      tags: [memberships]
      operationId: requestToJoin
      summary: Request to join a team
      description: |
        Join request from the team's public page; any signed-in user may call
        it, no membership needed. It creates a pending player membership, the
        same as accepting an invite; an admin approves or rejects it with
        `PATCH /memberships/{id}`. A user who left the team gets their old row
        back as pending. Asking again while pending changes nothing and
        answers 200. No request body.

        Rate limited to 10 new requests per user per window (NFR 10). The
        window is fixed: it lasts 24 hours from the user's first new request,
        then a new one starts, so up to 20 can land close together across the
        boundary. Only a 201 counts: a 200, 404 or 409 is free. At the limit
        every call answers 429, even one that would be free. The count lives
        in memory and resets when the API restarts.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller was already pending in the team; the membership is unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteAccepted"
        "201":
          description: Membership is now pending approval (new, or a left member back to pending).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: "`not_found`: unknown or dissolved team. No membership is created."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        const: not_found
        "409":
          description: "`already_member`: the caller is already active in the team (`status` is `active`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlreadyMemberError"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/TeamBusy"

  /teams/{id}/members:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    get:
      tags: [memberships]
      operationId: listMembers
      summary: List the team's roster
      description: |
        Active members only. Returns the active members; an admin also gets
        the pending ones (the approval list). Left members are never listed.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The roster.
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items:
                      $ref: "#/components/schemas/RosterMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /memberships/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Membership id. An unknown id answers 404, the same as a membership of a team the caller is not active in.
        schema:
          type: integer
          format: int64
          minimum: 1
    patch:
      tags: [memberships]
      operationId: updateMembership
      summary: Change a membership's role, decide a pending one, or edit the profile
      description: |
        Exactly one change per request (see the request body's `oneOf`):

        - `role`: promote or demote. Admins only, and an admin demotes only themselves (R6.12). Answers 200 with the Membership.
        - `decision: approve`: make a pending membership an active player. Admins only. Answers 200 with the Membership.
        - `decision: reject`: discard a pending membership. Admins only. Answers **204 with no body**.
        - `shirt_number` and/or `position`: edit the profile. Any active member
          can edit their own; editing someone else's is admin only. Answers 200
          with the Membership.

        Any active member of the team passes the route check; the admin check
        runs in the use case and answers 403 `forbidden`. Body validation
        (422) runs before that check, so a non-admin with an invalid body gets
        422, not 403.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMembershipRequest"
      responses:
        "200":
          description: Role changed, membership approved, or profile updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "204":
          description: Pending membership rejected. No body.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            - `forbidden`: role, decision or another member's profile sent by a non-admin.
            - `target_is_admin` (role): demoting another active admin. An admin stops being one only by demoting themselves or leaving. Nothing changes.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [forbidden, target_is_admin]
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            - `not_active` (role, profile): the target is pending or left.
            - `not_pending` (decision): the target is not pending.
            - `last_admin` (role): demoting the team's only active admin. No extra fields.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [not_active, not_pending, last_admin]
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "422":
          description: |
            - `nothing_to_update`: none of role, decision, shirt_number, position sent (a null role or decision counts as absent).
            - `one_change_at_a_time`: more than one kind of change sent.
            - `invalid_decision`: decision is a string other than approve or reject.
            - `invalid_role`: role is a string other than admin or player.
            - `invalid_shirt_number`: not an integer or null, or outside 0..99.
            - `invalid_position`: not a string or null, or not one of the positions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum:
                          - nothing_to_update
                          - one_change_at_a_time
                          - invalid_decision
                          - invalid_role
                          - invalid_shirt_number
                          - invalid_position
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          description: "`team_busy`: the team lock stayed held too long (role, decision, or editing another member). Retry after `Retry-After` seconds."
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        const: team_busy
    delete:
      tags: [memberships]
      operationId: leaveOrRemoveMembership
      summary: Leave the team, or remove a member
      description: |
        With the caller's own membership id, the caller leaves. With anyone
        else's, it removes them, admins only, and only a player. The row stays
        as `left` so team history is kept. Only active memberships can leave or
        be removed; a pending one is rejected with `PATCH` `decision: reject`
        instead.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The membership is now left.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            - `forbidden`: a non-admin removing someone else.
            - `target_is_admin`: removing another active admin. Admins remove only players. Nothing changes.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [forbidden, target_is_admin]
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            - `not_active`: the target is pending or left.
            - `last_admin`: the caller is leaving as the team's only active admin. No extra fields.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [not_active, last_admin]
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/TeamBusy"

  /teams/{id}/matches:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    post:
      tags: [matches]
      operationId: createMatch
      summary: Schedule a match
      description: |
        Admins only. `starts_at` is any RFC 3339 time within years 1 to 9999
        in UTC; it is stored and returned in UTC. Rival and location are free
        text, trimmed. Every active member gets a `match_created` notice
        (R11.4), stored with the match and pushed after it is saved: title
        "Partido nuevo: vs. <rival>", body like "Mar 20 · 19:00 · Cancha 3."
        with the time in the team's timezone.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMatchRequest"
      responses:
        "201":
          description: Match created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "422":
          description: |
            - `invalid_starts_at`: missing, or outside years 1 to 9999 in UTC.
            - `invalid_rival_name`: empty or over 60 characters after trimming, or contains control or invisible characters.
            - `invalid_location`: empty or over 120 characters after trimming, or contains control or invisible characters.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [invalid_starts_at, invalid_rival_name, invalid_location]
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/TeamBusy"
    get:
      tags: [matches]
      operationId: listMatches
      summary: List the team's matches, soonest first
      description: Active members only. Every match of the team, past and upcoming.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The team's matches.
          content:
            application/json:
              schema:
                type: object
                required: [matches]
                properties:
                  matches:
                    type: array
                    items:
                      $ref: "#/components/schemas/Match"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /matches/{id}:
    parameters:
      - $ref: "#/components/parameters/MatchID"
    patch:
      tags: [matches]
      operationId: updateMatch
      summary: Change a match's time, rival or location
      description: |
        Admins of the match's team only. Send any of the fields; an absent or
        null field keeps its value. Once attendance is saved, `starts_at`
        cannot change: schedule a new match instead. When the time or the
        location actually changes, every active member gets a `match_changed`
        notice ("Cambio de partido: vs. <rival>", body with the new values);
        a change of rival alone sends none (R11.4).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMatchRequest"
      responses:
        "200":
          description: The updated match.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            - `attendance_closed`: attendance is already saved, so `starts_at` cannot change.
            - `match_cancelled`: the match is cancelled.
            - `fixture_match`: a league match; only the operator changes it, through its fixture.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [attendance_closed, match_cancelled, fixture_match]
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "422":
          description: |
            - `nothing_to_update`: no field sent.
            - `invalid_starts_at`, `invalid_rival_name`, `invalid_location`: as in create.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [nothing_to_update, invalid_starts_at, invalid_rival_name, invalid_location]
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/TeamBusy"

  /matches/{id}/rsvp:
    parameters:
      - $ref: "#/components/parameters/MatchID"
    put:
      tags: [matches]
      operationId: answerRSVP
      summary: Answer going or not going to a match
      description: |
        Any active member of the match's team, for themselves. A new answer
        replaces the old one until kickoff; from `starts_at` on the answer is
        locked (R9.3-R9.5).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RSVPRequest"
      responses:
        "200":
          description: The stored answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RSVP"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            - `match_started`: `starts_at` is now or in the past; the answer did not change.
            - `match_cancelled`: the match is cancelled.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [match_started, match_cancelled]
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "422":
          description: "`invalid_answer`: not `going` or `not_going`."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        const: invalid_answer
        "500":
          $ref: "#/components/responses/Internal"

  /matches/{id}/attendance:
    parameters:
      - $ref: "#/components/parameters/MatchID"
    get:
      tags: [matches]
      operationId: getAttendance
      summary: The match's real attendee list
      description: |
        Active members only. Attendance saves itself from the going answers of
        current active members one hour after kickoff; `closed_at` is null
        until then. `locked` is true
        once a charge targets the match: the list can no longer change (R10).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The attendee list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
    put:
      tags: [matches]
      operationId: saveAttendance
      summary: Replace the match's attendee list
      description: |
        Admins only, after kickoff. Replaces the whole list and closes the
        attendance, so the automatic save skips the match. An empty list means
        nobody played. Rejected once a charge targets the match.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceRequest"
      responses:
        "200":
          description: The stored list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendance"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            - `match_not_started`: `starts_at` is still in the future.
            - `attendance_locked`: a charge targets this match; the list did not change.
            - `match_cancelled`: the match is cancelled.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [match_not_started, attendance_locked, match_cancelled]
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "422":
          description: "`invalid_attendees`: `membership_ids` is missing or null, or an id is not a membership of the team, or never joined it."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        const: invalid_attendees
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/TeamBusy"

  /venues:
    get:
      tags: [venues]
      operationId: listNearbyVenues
      summary: List venues near a location
      description: |
        Any signed-in user (R15.6). Venues within 25 km of `near`, nearest
        first, at most 50. The location is used for this request only: the
        API never stores or logs it, and nginx keeps no access log for this
        path.
      security:
        - bearerAuth: []
      parameters:
        - name: near
          in: query
          required: true
          description: |
            `latitude,longitude` in decimal degrees, no spaces, e.g.
            `31.8667,-116.5964`. Sent once.
          schema:
            type: string
            examples: ["31.8667,-116.5964"]
      responses:
        "200":
          description: The nearby venues; an empty list when none is within 25 km.
          content:
            application/json:
              schema:
                type: object
                required: [venues]
                properties:
                  venues:
                    type: array
                    items:
                      $ref: "#/components/schemas/NearbyVenue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: |
            - `invalid_near`: `near` missing, sent twice, not two numbers, or out of -90..90 / -180..180.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        const: invalid_near
        "500":
          $ref: "#/components/responses/Internal"
  /teams/{id}/public:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    get:
      tags: [public]
      operationId: getPublicTeam
      summary: A team's public page
      description: |
        Any signed-in user (R17.1-R17.4): name, initials, enrolled leagues
        with their venues, the number of active members and the active
        admins' names (shown as "Capitán"). Never the member list, shirt
        numbers, matches, RSVP, attendance, fees or notices (R17.5).
        `viewer_status` is the caller's own membership: `active` (offer no
        join request), `pending` (show it pending) or null (R17.6). A
        dissolved team answers 404 (R6.10).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicTeam"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /venues/{id}:
    parameters:
      - $ref: "#/components/parameters/VenueID"
    get:
      tags: [public]
      operationId: getVenuePage
      summary: A venue's public page
      description: |
        Any signed-in user (R17.7): name, address, map location, courts,
        and leagues grouped by weekday, Monday first, each day's leagues by
        start time. Weekdays without leagues are left out.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenuePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /leagues/{id}:
    parameters:
      - $ref: "#/components/parameters/LeagueID"
    get:
      tags: [public]
      operationId: getLeaguePage
      summary: A league's public page
      description: |
        Any signed-in user (R17.8): weekday and window (in the venue's
        timezone), season and venue.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaguePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /leagues/{id}/teams:
    parameters:
      - $ref: "#/components/parameters/LeagueID"
    get:
      tags: [public]
      operationId: listLeagueTeams
      summary: A league's enrolled teams
      description: Any signed-in user (R17.8). By name; dissolved teams are left out.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The teams.
          content:
            application/json:
              schema:
                type: object
                required: [teams]
                properties:
                  teams:
                    type: array
                    items:
                      $ref: "#/components/schemas/LeagueTeam"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /leagues/{id}/fixtures:
    parameters:
      - $ref: "#/components/parameters/LeagueID"
    get:
      tags: [public]
      operationId: listNextLeagueFixtures
      summary: A league's next fixtures
      description: |
        Any signed-in user (R17.8). Every fixture on the earliest date, in
        the venue's timezone, that has one starting after now; weeks without
        fixtures are skipped (open question 29). Cancelled fixtures never
        count. `date` is null and `fixtures` empty when none is left.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The next fixture day.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FixtureDay"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /operator/venues:
    post:
      tags: [operator]
      operationId: createVenue
      summary: Create a venue with its courts
      description: |
        Operator only (R15.1, R15.2). The venue and its courts are stored in
        one transaction: a venue is never stored without a court (R15.3).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVenueRequest"
      responses:
        "201":
          description: The venue, with its courts in the order sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Venue"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotOperator"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "409":
          description: |
            - `court_name_taken`: two courts in the request share a name.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [court_name_taken]
        "422":
          description: |
            - `invalid_name`: empty or over 60 characters after trimming, or contains control or invisible characters.
            - `invalid_address`: empty or over 160 characters after trimming, or contains control or invisible characters.
            - `invalid_coordinates`: latitude or longitude missing, or out of -90..90 / -180..180.
            - `invalid_timezone`: not a canonical IANA zone.
            - `invalid_courts`: no courts, or more than 50.
            - `invalid_court_name`: a court name is empty or over 30 characters after trimming, or contains control or invisible characters.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [invalid_name, invalid_address, invalid_coordinates, invalid_timezone, invalid_courts, invalid_court_name]
        "500":
          $ref: "#/components/responses/Internal"
  /operator/venues/{id}:
    parameters:
      - $ref: "#/components/parameters/VenueID"
    patch:
      tags: [operator]
      operationId: updateVenue
      summary: Change a venue's name, address, location or timezone
      description: |
        Operator only (R15.4). Send any of the fields; an absent or null field
        keeps its value. Courts change through their own routes.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVenueRequest"
      responses:
        "200":
          description: The updated venue, with its courts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Venue"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotOperator"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "422":
          description: |
            - `nothing_to_update`: no field sent.
            - `invalid_name`, `invalid_address`, `invalid_coordinates`, `invalid_timezone`: as in `POST /operator/venues`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [nothing_to_update, invalid_name, invalid_address, invalid_coordinates, invalid_timezone]
        "500":
          $ref: "#/components/responses/Internal"
  /operator/venues/{id}/courts:
    parameters:
      - $ref: "#/components/parameters/VenueID"
    post:
      tags: [operator]
      operationId: addCourt
      summary: Add a court to a venue
      description: Operator only (R15.4).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourtRequest"
      responses:
        "201":
          description: The new court.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Court"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotOperator"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            - `court_name_taken`: the venue already has a court with that name.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [court_name_taken]
        "422":
          description: |
            - `invalid_court_name`: missing, empty or over 30 characters after trimming, or contains control or invisible characters.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [invalid_court_name]
        "500":
          $ref: "#/components/responses/Internal"
  /operator/venues/{id}/courts/{courtId}:
    parameters:
      - $ref: "#/components/parameters/VenueID"
      - $ref: "#/components/parameters/CourtID"
    patch:
      tags: [operator]
      operationId: renameCourt
      summary: Rename a court
      description: Operator only (R15.4).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourtRequest"
      responses:
        "200":
          description: The renamed court.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Court"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotOperator"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            - `court_name_taken`: another court of the venue has that name.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [court_name_taken]
        "422":
          description: |
            - `nothing_to_update`: `name` missing or null.
            - `invalid_court_name`: as in `POST /operator/venues/{id}/courts`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [nothing_to_update, invalid_court_name]
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      tags: [operator]
      operationId: removeCourt
      summary: Remove a court
      description: |
        Operator only. A venue keeps at least one court (R15.3): removing the
        last one answers 409 `last_court`, checked in the delete's
        transaction under the venue lock, so two removals at once cannot
        both pass.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The court is removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotOperator"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            - `last_court`: it is the venue's only court; add another first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [last_court]
        "500":
          $ref: "#/components/responses/Internal"

  /operator/leagues:
    post:
      tags: [operator]
      operationId: createLeague
      summary: Create a league at a venue
      description: |
        Operator only (R16.1, R16.3). The league plays one weekday, from
        `start_time` to `end_time` in the venue's timezone, for one season.
        Several leagues can share a venue and weekday (R16.5).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeagueRequest"
      responses:
        "201":
          description: The league.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotOperator"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "422":
          description: |
            - `invalid_name`: empty or over 60 characters after trimming, or contains control or invisible characters.
            - `invalid_weekday`: not one of `monday` to `sunday`.
            - `invalid_window`: a time is missing or not `HH:MM` (00:00 to 23:59), or `end_time` is not after `start_time` (R16.2).
            - `invalid_season_name`: empty or over 40 characters after trimming, or contains control or invisible characters.
            - `invalid_season`: a date is missing or not `YYYY-MM-DD`, or `season_ends_on` is before `season_starts_on` (R16.3).
            - `invalid_venue`: `venue_id` missing or not a venue.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [invalid_name, invalid_weekday, invalid_window, invalid_season_name, invalid_season, invalid_venue]
        "500":
          $ref: "#/components/responses/Internal"
  /operator/leagues/{id}:
    parameters:
      - $ref: "#/components/parameters/LeagueID"
    patch:
      tags: [operator]
      operationId: updateLeague
      summary: Change a league
      description: |
        Operator only. Send any field; an absent or null one keeps its value.
        The window and season are checked on the result, so `end_time` alone
        must still be after the stored `start_time`. The venue cannot change.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLeagueRequest"
      responses:
        "200":
          description: The updated league.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotOperator"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "422":
          description: |
            - `nothing_to_update`: no field sent.
            - `invalid_name`: empty or over 60 characters after trimming, or contains control or invisible characters.
            - `invalid_weekday`: not one of `monday` to `sunday`.
            - `invalid_window`: a time is missing or not `HH:MM` (00:00 to 23:59), or `end_time` is not after `start_time` (R16.2).
            - `invalid_season_name`: empty or over 40 characters after trimming, or contains control or invisible characters.
            - `invalid_season`: a date is missing or not `YYYY-MM-DD`, or `season_ends_on` is before `season_starts_on` (R16.3).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [nothing_to_update, invalid_name, invalid_weekday, invalid_window, invalid_season_name, invalid_season]
        "500":
          $ref: "#/components/responses/Internal"
  /operator/leagues/{id}/teams:
    parameters:
      - $ref: "#/components/parameters/LeagueID"
    post:
      tags: [operator]
      operationId: enrollTeam
      summary: Enroll a team in a league
      description: |
        Operator only (R16.6). A team can be in several leagues (R16.9), once
        per league (R16.7). A dissolved team cannot be enrolled (R6.10).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollTeamRequest"
      responses:
        "201":
          description: The enrollment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotOperator"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "409":
          description: |
            - `already_enrolled`: the team is already in this league.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [already_enrolled]
        "422":
          description: |
            - `invalid_team`: `team_id` missing, not a team, or a dissolved team.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [invalid_team]
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/TeamBusy"
  /operator/leagues/{id}/teams/{teamId}:
    parameters:
      - $ref: "#/components/parameters/LeagueID"
      - name: teamId
        in: path
        required: true
        description: Team id. A team not enrolled in the league answers 404.
        schema:
          type: integer
          format: int64
          minimum: 1
    delete:
      tags: [operator]
      operationId: unenrollTeam
      summary: Remove a team from a league
      description: |
        Operator only (R16.8). The team can be enrolled again later. In the
        same transaction, the team's future fixtures in the league are
        deleted and both sides' linked matches cancelled, each team getting a
        `match_changed` notice ("Partido cancelado: vs. <rival>"). Past
        matches keep their attendance and fees.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The team is no longer enrolled.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotOperator"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /operator/leagues/{id}/fixtures:
    parameters:
      - $ref: "#/components/parameters/LeagueID"
    post:
      tags: [operator]
      operationId: createFixture
      summary: Schedule a league fixture
      description: |
        Operator only. Home and away are two different teams enrolled in the
        league; the court is one of the league's venue; `starts_at` falls on
        the league's weekday, inside its window, in the venue's timezone (at
        or after `start_time`, before `end_time`). In one transaction it
        creates the fixture, one match per team (rival: the other team;
        location: "<venue> · <court>") and a `match_created` notice for each
        team, pushed after commit (R11.4). Teams cannot change these matches
        (`PATCH /matches/{id}` answers 409 `fixture_match`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFixtureRequest"
      responses:
        "201":
          description: The fixture and its two matches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fixture"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotOperator"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "422":
          description: |
            - `same_team`: home and away are the same team.
            - `team_not_enrolled`: a team is not enrolled in the league, unknown, or dissolved.
            - `invalid_court`: the court is not one of the league's venue.
            - `outside_league_window`: not on the league's weekday inside its window, in the venue's timezone.
            - `invalid_starts_at`: missing, or outside years 1 to 9999.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [same_team, team_not_enrolled, invalid_court, outside_league_window, invalid_starts_at]
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/TeamBusy"
  /operator/leagues/{id}/fixtures/{fixtureId}:
    parameters:
      - $ref: "#/components/parameters/LeagueID"
      - name: fixtureId
        in: path
        required: true
        description: Fixture id. A fixture of another league answers 404, like an unknown one.
        schema:
          type: integer
          format: int64
          minimum: 1
    patch:
      tags: [operator]
      operationId: updateFixture
      summary: Move a fixture
      description: |
        Operator only. Send `starts_at`, `court_id` or both; an absent or
        null field keeps its value. The result is checked like a new fixture.
        Both linked matches move in the same transaction and each team gets a
        `match_changed` notice when the time or court actually changes.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFixtureRequest"
      responses:
        "200":
          description: The fixture and its two matches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fixture"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotOperator"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            - `fixture_cancelled`: the fixture was deleted.
            - `attendance_closed`: a team already saved attendance; the time can no longer change (the court can).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [fixture_cancelled, attendance_closed]
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "422":
          description: |
            - `nothing_to_update`: neither field sent.
            - `invalid_court`, `outside_league_window`, `invalid_starts_at`: as in `POST`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [nothing_to_update, invalid_court, outside_league_window, invalid_starts_at]
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      tags: [operator]
      operationId: deleteFixture
      summary: Delete a fixture
      description: |
        Operator only, before kickoff. The fixture and both linked matches
        are cancelled in one transaction (the rows stay, with `cancelled_at`)
        and each team gets a `match_changed` notice ("Partido cancelado: vs.
        <rival>").
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The fixture is deleted and its matches cancelled.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotOperator"
        "404":
          description: "`not_found`: unknown fixture, one of another league, or one already deleted."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            - `fixture_started`: the fixture has kicked off; it stays.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        enum: [fixture_started]
        "500":
          $ref: "#/components/responses/Internal"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Opaque session token (not a JWT) from register or login, sent as
        `Authorization: Bearer <token>`. A session unused for 60 days expires.
        Tokens are not rotated.

  parameters:
    TeamID:
      name: id
      in: path
      required: true
      description: Team id.
      schema:
        type: integer
        format: int64
        minimum: 1
    MatchID:
      name: id
      in: path
      required: true
      description: Match id. An unknown id answers 404, the same as a match of a team the caller is not active in.
      schema:
        type: integer
        format: int64
        minimum: 1

    VenueID:
      name: id
      in: path
      required: true
      description: Venue id. An unknown id answers 404.
      schema:
        type: integer
        format: int64
        minimum: 1
    LeagueID:
      name: id
      in: path
      required: true
      description: League id. An unknown id answers 404.
      schema:
        type: integer
        format: int64
        minimum: 1
    CourtID:
      name: courtId
      in: path
      required: true
      description: Court id. A court of another venue answers 404, like an unknown one.
      schema:
        type: integer
        format: int64
        minimum: 1

  headers:
    RetryAfter:
      description: Seconds to wait before retrying (integer).
      schema:
        type: integer
        minimum: 0
    WWWAuthenticate:
      description: Always `Bearer`.
      schema:
        type: string
        const: Bearer
    Allow:
      description: Methods the path accepts, e.g. `GET, HEAD`.
      schema:
        type: string

  responses:
    InvalidRequest:
      description: "`invalid_request`: the body is not valid JSON for this endpoint (including an unknown field), or the client address could not be read (rate-limited routes)."
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    const: invalid_request
    Unauthorized:
      description: "`unauthorized`: missing, malformed, unknown or expired bearer token."
      headers:
        WWW-Authenticate:
          $ref: "#/components/headers/WWWAuthenticate"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    const: unauthorized
    Forbidden:
      description: "`forbidden`: the caller is an active member but not an admin."
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    const: forbidden
    NotOperator:
      description: "`forbidden`: the caller is not the operator. Team roles never count (rule 12)."
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    const: forbidden
    NotFound:
      description: "`not_found`: unknown route or resource, or a team hidden from the caller (not an active member)."
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    const: not_found
    MethodNotAllowed:
      description: "`method_not_allowed`: the path exists but not with this method. Applies to every path."
      headers:
        Allow:
          $ref: "#/components/headers/Allow"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    const: method_not_allowed
    BodyTooLarge:
      description: "`body_too_large`: the JSON body is over 16 KiB."
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    const: body_too_large
    TooManyAttempts:
      description: "`too_many_attempts`: rate limit reached."
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    const: too_many_attempts
    TeamBusy:
      description: "`team_busy`: the team lock stayed held too long; nothing changed. Retry after `Retry-After` seconds (always 1)."
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    const: team_busy
    ServerBusy:
      description: "`server_busy`: the password hasher is at capacity; nothing was done. Retry after `Retry-After` seconds (always 1)."
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    const: server_busy
    Internal:
      description: "`internal`: unexpected server error."
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  error:
                    const: internal

  schemas:
    Role:
      type: string
      enum: [admin, player]
      description: Permission role. The app shows `admin` as "Capitán".
    MembershipStatus:
      type: string
      enum: [pending, active, left]
    Decision:
      type: string
      enum: [approve, reject]
      description: Request-only action on a pending membership. Never returned; approve stores `active`, reject removes the pending row.
    Position:
      type: string
      enum: [goalkeeper, defender, midfielder, forward]
    ShirtNumber:
      type: integer
      minimum: 0
      maximum: 99
    Timestamp:
      type: string
      format: date-time
      description: Always UTC with whole seconds, e.g. "2026-10-11T23:53:00Z".
      examples: ["2026-10-11T23:53:00Z"]

    Error:
      type: object
      required: [error]
      description: Body of every error response. Switch on `error`.
      properties:
        error:
          $ref: "#/components/schemas/ErrorCode"
    ErrorCode:
      type: string
      description: Every error code the API emits.
      enum:
        - invalid_request
        - body_too_large
        - internal
        - not_found
        - method_not_allowed
        - unauthorized
        - forbidden
        - too_many_attempts
        - server_busy
        - team_busy
        - invalid_name
        - invalid_email
        - password_too_short
        - password_too_long
        - birth_date_required
        - invalid_birth_date
        - birth_date_in_future
        - underage
        - email_taken
        - invalid_credentials
        - invalid_timezone
        - nothing_to_update
        - too_many_invites
        - invite_not_found
        - invite_expired
        - invite_revoked
        - already_member
        - invalid_role
        - invalid_decision
        - invalid_shirt_number
        - invalid_position
        - one_change_at_a_time
        - not_active
        - not_pending
        - last_admin
        - last_admin_of_teams
        - target_is_admin
        - team_has_members
        - invalid_starts_at
        - invalid_rival_name
        - invalid_location
        - attendance_closed
        - invalid_answer
        - match_started
        - match_not_started
        - attendance_locked
        - invalid_attendees
        - invalid_upcoming
        - invalid_device_token
        - invalid_address
        - invalid_coordinates
        - invalid_courts
        - invalid_court_name
        - court_name_taken
        - last_court
        - invalid_near
        - invalid_weekday
        - invalid_window
        - invalid_season_name
        - invalid_season
        - invalid_venue
        - invalid_team
        - already_enrolled
        - same_team
        - team_not_enrolled
        - invalid_court
        - outside_league_window
        - fixture_started
        - fixture_cancelled
        - match_cancelled
        - fixture_match
    AlreadyMemberError:
      type: object
      required: [error, status]
      properties:
        error:
          type: string
          const: already_member
        status:
          description: The caller's current status in the team (active or pending).
          $ref: "#/components/schemas/MembershipStatus"
    LastAdminOfTeamsError:
      type: object
      required: [error, teams]
      properties:
        error:
          type: string
          const: last_admin_of_teams
        teams:
          type: array
          description: Teams where the caller is the only active admin.
          items:
            allOf:
              - $ref: "#/components/schemas/Team"
              - type: object
                required: [sole_member]
                properties:
                  sole_member:
                    type: boolean
                    description: |
                      True when the caller is the team's only active member:
                      offer "Disolver equipo" (`DELETE /teams/{id}`). False:
                      offer promoting another member.

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, password, birth_date]
      properties:
        name:
          type: string
          description: 1 to 100 characters after trimming.
        email:
          type: string
          format: email
          description: Trimmed and lowercased; at most 254 bytes.
        password:
          type: string
          minLength: 8
          maxLength: 128
        birth_date:
          type: string
          format: date
          description: "`YYYY-MM-DD`. The user must be at least 15."
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    AuthSession:
      type: object
      required: [user_id, token]
      description: Returned by register (201) and login (200).
      properties:
        user_id:
          type: integer
          format: int64
        token:
          type: string
          description: Opaque bearer token. Store it in the Keychain.

    Team:
      type: object
      required: [id, name, timezone, created_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        timezone:
          type: string
          description: IANA zone, e.g. `America/Tijuana`.
        created_at:
          $ref: "#/components/schemas/Timestamp"
    CreateTeamRequest:
      type: object
      additionalProperties: false
      required: [name, timezone]
      properties:
        name:
          type: string
          description: 1 to 35 characters after trimming; no control or invisible characters.
        timezone:
          type: string
          description: Canonical IANA zone, e.g. `America/Tijuana`.
    UpdateTeamRequest:
      type: object
      additionalProperties: false
      description: At least one field. Absent or null keeps the current value.
      properties:
        name:
          type: [string, "null"]
        timezone:
          type: [string, "null"]

    Match:
      type: object
      required: [id, team_id, starts_at, rival_name, location, fixture_id, court_id, cancelled_at]
      properties:
        id:
          type: integer
          format: int64
        team_id:
          type: integer
          format: int64
        starts_at:
          $ref: "#/components/schemas/Timestamp"
        rival_name:
          type: string
          description: On a league match, the other team's current name.
        location:
          type: string
          description: On a league match, "<venue> · <court>".
        fixture_id:
          type: [integer, "null"]
          format: int64
          description: The league fixture this match belongs to; null for a match the team scheduled.
        court_id:
          type: [integer, "null"]
          format: int64
          description: The court of a league match; null otherwise.
        cancelled_at:
          description: |
            When the match was cancelled (its league fixture was deleted, or
            the team left the league); null otherwise. A cancelled match stays
            in `GET /teams/{id}/matches`, is left out of `GET /me/matches`,
            and takes no RSVP, attendance or change.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
    UpcomingMatch:
      description: A match plus the team, the caller's role and answer, and the RSVP counts (R14.2).
      allOf:
        - $ref: "#/components/schemas/Match"
        - type: object
          required: [team_name, role, answer, going_count, not_going_count]
          properties:
            team_name:
              type: string
            role:
              description: The caller's role in the team.
              $ref: "#/components/schemas/Role"
            answer:
              description: The caller's own answer; null when none.
              oneOf:
                - $ref: "#/components/schemas/RSVPAnswer"
                - type: "null"
            going_count:
              type: integer
              description: Active members of the team who answered going.
            not_going_count:
              type: integer
              description: Active members of the team who answered not going.
    InboxNotification:
      description: A notice as the caller sees it in the inbox (R11.1, R24.6).
      type: object
      required: [id, team_id, team_name, kind, title, body, match_id, created_at, read_at]
      properties:
        id:
          type: integer
          format: int64
        team_id:
          type: integer
          format: int64
        team_name:
          type: string
        kind:
          type: string
          enum: [manual, match_created, match_changed, rsvp_reminder]
        title:
          type: string
        body:
          type: string
        match_id:
          description: The match an automatic notice is about; null otherwise.
          type: [integer, "null"]
          format: int64
        created_at:
          type: string
          format: date-time
          description: UTC, whole seconds.
        read_at:
          description: When the caller opened the notice (UI "opened the notice", R11.11); null until then. On a notice the caller sent, it is the send time. UTC, whole seconds.
          type: [string, "null"]
          format: date-time
    CreateMatchRequest:
      type: object
      additionalProperties: false
      required: [starts_at, rival_name, location]
      properties:
        starts_at:
          type: string
          format: date-time
          description: RFC 3339 with any offset, within years 1 to 9999 in UTC; stored in UTC.
        rival_name:
          type: string
          description: 1 to 60 characters after trimming; no control or invisible characters.
        location:
          type: string
          description: 1 to 120 characters after trimming; no control or invisible characters.
    UpdateMatchRequest:
      type: object
      additionalProperties: false
      description: At least one field. Absent or null keeps the current value.
      properties:
        starts_at:
          type: [string, "null"]
          format: date-time
        rival_name:
          type: [string, "null"]
        location:
          type: [string, "null"]
    RSVPAnswer:
      type: string
      enum: [going, not_going]
    RSVPRequest:
      type: object
      additionalProperties: false
      required: [answer]
      properties:
        answer:
          $ref: "#/components/schemas/RSVPAnswer"
    RSVP:
      type: object
      required: [match_id, membership_id, answer, updated_at]
      properties:
        match_id:
          type: integer
          format: int64
        membership_id:
          type: integer
          format: int64
          description: The caller's membership.
        answer:
          $ref: "#/components/schemas/RSVPAnswer"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
    AttendanceRequest:
      type: object
      additionalProperties: false
      required: [membership_ids]
      properties:
        membership_ids:
          type: array
          description: Memberships that joined the team at some point (active, left, or pending again after leaving); one that never joined is rejected. Duplicates are folded. Empty means nobody played.
          items:
            type: integer
            format: int64
    Attendance:
      type: object
      required: [match_id, membership_ids, closed_at, locked]
      properties:
        match_id:
          type: integer
          format: int64
        membership_ids:
          type: array
          description: Always an array, ascending; `[]` when nobody is listed.
          items:
            type: integer
            format: int64
        closed_at:
          description: When the list was first saved (automatic or by an admin); null while open.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        locked:
          type: boolean
          description: True once a charge targets the match; PUT then answers 409.

    InviteCreated:
      type: object
      required: [id, token, url, expires_at]
      properties:
        id:
          type: integer
          format: int64
        token:
          type: string
          description: Returned only here; the server keeps a hash.
        url:
          type: string
          format: uri
          description: Universal Link, `<public base URL>/i/<token>`.
        expires_at:
          $ref: "#/components/schemas/Timestamp"
    InviteSummary:
      type: object
      required: [id, created_by, expires_at, revoked_at]
      properties:
        id:
          type: integer
          format: int64
        created_by:
          type: integer
          format: int64
          description: Membership id of the admin who created it (match it against the roster).
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        revoked_at:
          description: When it was first revoked; null while it still works.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
    AcceptInviteRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          description: The token from the invite link. Sent in the body so it stays out of access logs.
    InviteAccepted:
      type: object
      description: Returned by POST /invites/accept and POST /teams/{id}/join-requests.
      required: [team_id, team_name, status]
      properties:
        team_id:
          type: integer
          format: int64
        team_name:
          type: string
        status:
          description: Always `pending` today.
          $ref: "#/components/schemas/MembershipStatus"

    JoinRequest:
      type: object
      description: One of the caller's pending memberships (GET /me/join-requests).
      required: [id, team_id, team_name, requested_at]
      properties:
        id:
          type: integer
          format: int64
          description: The membership id.
        team_id:
          type: integer
          format: int64
        team_name:
          type: string
        requested_at:
          $ref: "#/components/schemas/Timestamp"
          description: |
            When the membership became pending: the join request or invite
            accept. A member who left and came back gets the date of the new
            request.

    Membership:
      type: object
      description: Returned by PATCH /memberships/{id}.
      required: [id, team_id, role, status, shirt_number, position]
      properties:
        id:
          type: integer
          format: int64
        team_id:
          type: integer
          format: int64
        role:
          $ref: "#/components/schemas/Role"
        status:
          $ref: "#/components/schemas/MembershipStatus"
        shirt_number:
          description: Always present, null when unset.
          oneOf:
            - $ref: "#/components/schemas/ShirtNumber"
            - type: "null"
        position:
          description: Always present, null when unset.
          oneOf:
            - $ref: "#/components/schemas/Position"
            - type: "null"
    RosterMember:
      type: object
      required: [id, name, role, status, shirt_number, position]
      properties:
        id:
          type: integer
          format: int64
          description: Membership id.
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        status:
          description: "`active`, or `pending` (admins only see pending)."
          $ref: "#/components/schemas/MembershipStatus"
        shirt_number:
          description: Always present, null when unset.
          oneOf:
            - $ref: "#/components/schemas/ShirtNumber"
            - type: "null"
        position:
          description: Always present, null when unset.
          oneOf:
            - $ref: "#/components/schemas/Position"
            - type: "null"

    UpdateMembershipRequest:
      description: Exactly one kind of change per request.
      oneOf:
        - $ref: "#/components/schemas/RoleChange"
        - $ref: "#/components/schemas/DecisionChange"
        - $ref: "#/components/schemas/ProfileChange"
    RoleChange:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/Role"
    DecisionChange:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          $ref: "#/components/schemas/Decision"
    ProfileChange:
      type: object
      additionalProperties: false
      description: |
        One or both fields. An absent field keeps its value; an explicit null
        clears it.
      properties:
        shirt_number:
          oneOf:
            - $ref: "#/components/schemas/ShirtNumber"
            - type: "null"
        position:
          oneOf:
            - $ref: "#/components/schemas/Position"
            - type: "null"
      anyOf:
        - required: [shirt_number]
        - required: [position]

    Venue:
      type: object
      required: [id, name, address, latitude, longitude, timezone, courts, created_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        address:
          type: string
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        timezone:
          type: string
          description: IANA zone, e.g. `America/Tijuana`.
        courts:
          type: array
          minItems: 1
          description: Oldest first.
          items:
            $ref: "#/components/schemas/Court"
        created_at:
          $ref: "#/components/schemas/Timestamp"
    Court:
      type: object
      required: [id, venue_id, name]
      properties:
        id:
          type: integer
          format: int64
        venue_id:
          type: integer
          format: int64
        name:
          type: string
    CreateVenueRequest:
      type: object
      additionalProperties: false
      required: [name, address, latitude, longitude, timezone, courts]
      properties:
        name:
          type: string
          description: 1 to 60 characters after trimming; no control or invisible characters.
        address:
          type: string
          description: 1 to 160 characters after trimming; no control or invisible characters.
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        timezone:
          type: string
          description: Canonical IANA zone, e.g. `America/Tijuana`.
        courts:
          type: array
          minItems: 1
          maxItems: 50
          description: Names must differ within the venue.
          items:
            $ref: "#/components/schemas/CourtRequest"
    UpdateVenueRequest:
      type: object
      additionalProperties: false
      description: At least one field. Absent or null keeps the current value.
      properties:
        name:
          type: [string, "null"]
        address:
          type: [string, "null"]
        latitude:
          type: [number, "null"]
        longitude:
          type: [number, "null"]
        timezone:
          type: [string, "null"]
    CourtRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          description: 1 to 30 characters after trimming; no control or invisible characters; unique within the venue.
    NearbyVenue:
      type: object
      required: [id, name, address, latitude, longitude, timezone, court_count, distance_m]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        address:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        timezone:
          type: string
          description: IANA zone, e.g. `America/Tijuana`.
        court_count:
          type: integer
          minimum: 1
        distance_m:
          type: integer
          minimum: 0
          maximum: 25000
          description: Great-circle distance from `near`, rounded to the meter.
    Weekday:
      type: string
      enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
    TimeOfDay:
      type: string
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      description: Wall-clock `HH:MM` in the venue's timezone.
      examples: ["20:00"]
    League:
      type: object
      required: [id, venue_id, name, weekday, start_time, end_time, season_name, season_starts_on, season_ends_on, created_at]
      properties:
        id:
          type: integer
          format: int64
        venue_id:
          type: integer
          format: int64
        name:
          type: string
          description: 1 to 60 characters after trimming; no control or invisible characters.
        weekday:
          $ref: "#/components/schemas/Weekday"
        start_time:
          $ref: "#/components/schemas/TimeOfDay"
        end_time:
          $ref: "#/components/schemas/TimeOfDay"
        season_name:
          type: string
          description: 1 to 40 characters after trimming; no control or invisible characters.
        season_starts_on:
          type: string
          format: date
        season_ends_on:
          type: string
          format: date
        created_at:
          $ref: "#/components/schemas/Timestamp"
    CreateLeagueRequest:
      type: object
      additionalProperties: false
      required: [venue_id, name, weekday, start_time, end_time, season_name, season_starts_on, season_ends_on]
      description: "`end_time` after `start_time`; `season_ends_on` not before `season_starts_on`."
      properties:
        venue_id:
          type: integer
          format: int64
        name:
          type: string
          description: 1 to 60 characters after trimming; no control or invisible characters.
        weekday:
          $ref: "#/components/schemas/Weekday"
        start_time:
          $ref: "#/components/schemas/TimeOfDay"
        end_time:
          $ref: "#/components/schemas/TimeOfDay"
        season_name:
          type: string
          description: 1 to 40 characters after trimming; no control or invisible characters.
        season_starts_on:
          type: string
          format: date
        season_ends_on:
          type: string
          format: date
    UpdateLeagueRequest:
      type: object
      additionalProperties: false
      description: At least one field. Absent or null keeps the current value. The venue cannot change.
      properties:
        name:
          type: [string, "null"]
        weekday:
          type: [string, "null"]
        start_time:
          type: [string, "null"]
        end_time:
          type: [string, "null"]
        season_name:
          type: [string, "null"]
        season_starts_on:
          type: [string, "null"]
        season_ends_on:
          type: [string, "null"]
    EnrollTeamRequest:
      type: object
      additionalProperties: false
      required: [team_id]
      properties:
        team_id:
          type: integer
          format: int64
    Enrollment:
      type: object
      required: [league_id, team_id, enrolled_at]
      properties:
        league_id:
          type: integer
          format: int64
        team_id:
          type: integer
          format: int64
        enrolled_at:
          $ref: "#/components/schemas/Timestamp"
    Fixture:
      type: object
      required: [id, league_id, home_team_id, away_team_id, court_id, starts_at, matches]
      properties:
        id:
          type: integer
          format: int64
        league_id:
          type: integer
          format: int64
        home_team_id:
          type: integer
          format: int64
        away_team_id:
          type: integer
          format: int64
        court_id:
          type: integer
          format: int64
        starts_at:
          $ref: "#/components/schemas/Timestamp"
        matches:
          type: array
          description: The two linked matches, home first.
          items:
            type: object
            required: [id, team_id]
            properties:
              id:
                type: integer
                format: int64
              team_id:
                type: integer
                format: int64
    CreateFixtureRequest:
      type: object
      additionalProperties: false
      required: [home_team_id, away_team_id, court_id, starts_at]
      properties:
        home_team_id:
          type: integer
          format: int64
        away_team_id:
          type: integer
          format: int64
        court_id:
          type: integer
          format: int64
        starts_at:
          type: string
          format: date-time
          description: Any RFC 3339 time; stored and returned in UTC.
    UpdateFixtureRequest:
      type: object
      additionalProperties: false
      description: At least one field. Absent or null keeps the current value.
      properties:
        starts_at:
          type: [string, "null"]
          format: date-time
        court_id:
          type: [integer, "null"]
          format: int64
    Ref:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    PublicTeam:
      type: object
      additionalProperties: false
      required: [id, name, initials, active_members, captains, leagues, viewer_status]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        initials:
          type: string
          description: First letters of the first two words ("Atlético Narvarte" is "AN"), or the first two letters of a one-word name, uppercased.
        active_members:
          type: integer
        captains:
          type: array
          description: The active admins' names, by name. The app labels them "Capitán".
          items:
            type: string
        leagues:
          type: array
          description: Monday first, then by start time.
          items:
            type: object
            required: [id, name, weekday, start_time, end_time, venue]
            properties:
              id:
                type: integer
                format: int64
              name:
                type: string
              weekday:
                $ref: "#/components/schemas/Weekday"
              start_time:
                $ref: "#/components/schemas/TimeOfDay"
              end_time:
                $ref: "#/components/schemas/TimeOfDay"
              venue:
                $ref: "#/components/schemas/Ref"
        viewer_status:
          description: The caller's own membership; null when none, or left.
          type: [string, "null"]
          enum: [active, pending, null]
    VenuePage:
      type: object
      required: [id, name, address, latitude, longitude, timezone, courts, weekdays]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        address:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        timezone:
          type: string
        courts:
          type: array
          items:
            $ref: "#/components/schemas/Ref"
        weekdays:
          type: array
          description: Monday first; only weekdays with leagues.
          items:
            type: object
            required: [weekday, leagues]
            properties:
              weekday:
                $ref: "#/components/schemas/Weekday"
              leagues:
                type: array
                description: By start time.
                items:
                  type: object
                  required: [id, name, start_time, end_time]
                  properties:
                    id:
                      type: integer
                      format: int64
                    name:
                      type: string
                    start_time:
                      $ref: "#/components/schemas/TimeOfDay"
                    end_time:
                      $ref: "#/components/schemas/TimeOfDay"
    LeaguePage:
      type: object
      required: [id, name, weekday, start_time, end_time, season_name, season_starts_on, season_ends_on, venue]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        weekday:
          $ref: "#/components/schemas/Weekday"
        start_time:
          $ref: "#/components/schemas/TimeOfDay"
        end_time:
          $ref: "#/components/schemas/TimeOfDay"
        season_name:
          type: string
        season_starts_on:
          type: string
          format: date
        season_ends_on:
          type: string
          format: date
        venue:
          type: object
          required: [id, name, address, timezone]
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string
            address:
              type: string
            timezone:
              type: string
    LeagueTeam:
      type: object
      required: [id, name, initials]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        initials:
          type: string
    FixtureDay:
      type: object
      required: [date, fixtures]
      properties:
        date:
          type: [string, "null"]
          format: date
          description: The date in the venue's timezone; null when no fixture is left.
        fixtures:
          type: array
          description: By kickoff.
          items:
            type: object
            required: [id, starts_at, court, home, away]
            properties:
              id:
                type: integer
                format: int64
              starts_at:
                $ref: "#/components/schemas/Timestamp"
              court:
                $ref: "#/components/schemas/Ref"
              home:
                $ref: "#/components/schemas/Ref"
              away:
                $ref: "#/components/schemas/Ref"
